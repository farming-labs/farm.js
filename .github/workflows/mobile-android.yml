name: Mobile Android

# Builds each mobile example's Android app with Gradle and runs it on an Android emulator:
# examples/mobile (Field Notes, the complete example) and examples/mobile-minimal (Trail Guide, the
# zero-native-code path). It keeps the same evidence the Mobile iOS workflow keeps for the iOS
# shell: the APK builds, the app launches, the home route draws native content, and the log holds
# no fatal error. Ubuntu runners have the Android SDK preinstalled and KVM available, so this needs
# no third-party action.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/farm-mobile/**"
      - "packages/farm/src/mobile/**"
      - "packages/farm-cli/src/mobile*.ts"
      - "examples/mobile/**"
      - "examples/mobile-minimal/**"
      - ".github/workflows/mobile-android.yml"

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-emulator:
    name: Android emulator (${{ matrix.example }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One example's failure keeps the other's evidence.
      fail-fast: false
      matrix:
        include:
          - example: mobile
            app-id: dev.farmjs.examples.fieldnotes
            server-routes: "/"
          - example: mobile-minimal
            app-id: dev.farmjs.examples.trailguide
            server-routes: "/ /trails/[id]"
    env:
      AVD_IMAGE: system-images;android-35;google_apis;x86_64
    steps:
      - run: echo "EVIDENCE=$RUNNER_TEMP/android-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - run: pnpm install --frozen-lockfile
      - name: Build local framework packages
        run: |
          pnpm --filter @farm.js/core build
          pnpm --filter @farm.js/cli build
          pnpm --filter @farm.js/mobile build
          pnpm --filter @farm.js/native build
          pnpm --filter @farm.js/ui build
        env:
          NODE_OPTIONS: --max-old-space-size=12288

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the emulator and system image
        run: |
          mkdir -p "$EVIDENCE"
          SDK="${ANDROID_HOME:?The runner image should set ANDROID_HOME}"
          # avdmanager (Java) and the emulator binary can disagree about the AVD home on the
          # runner; one explicit directory for both ends the argument.
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/avd" >> "$GITHUB_ENV"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$MANAGER" --licenses > /dev/null || true
          "$MANAGER" "platform-tools" "platforms;android-35" "emulator" "$AVD_IMAGE" \
            | grep -v '%' | tee "$EVIDENCE/sdkmanager.txt"
          echo "no" | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd \
            --name farm --package "$AVD_IMAGE" --device pixel_7 --force
          "$SDK/emulator/emulator" -list-avds | tee "$EVIDENCE/avds.txt"
          grep -qx "farm" "$EVIDENCE/avds.txt"

      # A CA made for this run only. The APK is debuggable, so FARM_MOBILE_DEBUG_CA makes it trust
      # this CA too (network_security_config's debug-overrides); a release build never would.
      - name: Make the run's certificates
        run: |
          "$GITHUB_WORKSPACE/examples/mobile/scripts/ci-tls.sh" "$RUNNER_TEMP/tls"
          echo "FARM_MOBILE_DEBUG_CA=$RUNNER_TEMP/tls/ca.pem" >> "$GITHUB_ENV"

      # The production APK loads from the app's own production server, built by the same command
      # and served over HTTPS on this runner, which the emulator reaches as 10.0.2.2.
      - name: Build the APK with farm build --mobile --apk
        working-directory: examples/${{ matrix.example }}
        env:
          FIELD_NOTES_SERVER: https://10.0.2.2:3443
          TRAIL_GUIDE_SERVER: https://10.0.2.2:3443
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          pnpm exec farm build --mobile --apk 2>&1 | tee "$EVIDENCE/farm-build-android.txt"

      - name: Serve the production build over HTTPS
        working-directory: examples/${{ matrix.example }}
        run: |
          PORT=3100 HOST=127.0.0.1 node .farm/output/mobile/www/server/index.mjs \
            > "$EVIDENCE/production-server.txt" 2>&1 &
          echo "PRODUCTION_SERVER_PID=$!" >> "$GITHUB_ENV"
          node "$GITHUB_WORKSPACE/examples/mobile/scripts/https-proxy.mjs" \
            "$RUNNER_TEMP/tls/server.pem" "$RUNNER_TEMP/tls/server-key.pem" 3443 3100 \
            > "$EVIDENCE/https-proxy.txt" 2>&1 &
          echo "HTTPS_PROXY_PID=$!" >> "$GITHUB_ENV"
          node "$GITHUB_WORKSPACE/examples/mobile/scripts/https-ready.mjs" "$RUNNER_TEMP/tls/ca.pem" \
            https://localhost:3443/ 60 || { cat "$EVIDENCE/production-server.txt" "$EVIDENCE/https-proxy.txt"; exit 1; }
          cat "$EVIDENCE/production-server.txt" "$EVIDENCE/https-proxy.txt"

      - name: Boot the emulator
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ANDROID_HOME/emulator/emulator" -avd farm -no-window -no-audio -no-boot-anim \
            -no-snapshot -no-metrics -camera-back none -camera-front none \
            -gpu swiftshader_indirect > "$EVIDENCE/emulator.txt" 2>&1 &
          EMULATOR_PID=$!
          # Fail with the emulator's own output instead of hanging when it dies at startup.
          if ! timeout 420 "$ADB" wait-for-device; then
            echo "::error::The emulator never registered with adb."
            tail -50 "$EVIDENCE/emulator.txt"
            exit 1
          fi
          boot=""
          for _ in $(seq 1 90); do
            kill -0 "$EMULATOR_PID" 2>/dev/null || { tail -50 "$EVIDENCE/emulator.txt"; exit 1; }
            boot=$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$boot" = "1" ] && break
            sleep 5
          done
          if [ "$boot" != "1" ]; then
            echo "::error::The emulator did not finish booting."
            tail -50 "$EVIDENCE/emulator.txt"
            exit 1
          fi
          # Booted is not online: the app loads from farm dev at 10.0.2.2, the host's loopback, and
          # the guest network can come up after boot. Wait until the guest opens a TCP connection
          # to the host's adb server (127.0.0.1:5037), which always listens, so a fast launch does
          # not race it into ERR_ADDRESS_UNREACHABLE.
          online=""
          for _ in $(seq 1 60); do
            if "$ADB" shell 'echo | toybox nc -w 2 10.0.2.2 5037' > "$EVIDENCE/host-probe.txt" 2>&1; then
              online=1
              break
            fi
            sleep 2
          done
          if [ -z "$online" ]; then
            echo "::error::The emulator never reached the host at 10.0.2.2."
            cat "$EVIDENCE/host-probe.txt"
            "$ADB" shell ip route | tee "$EVIDENCE/routes.txt" || true
            exit 1
          fi
          "$ADB" devices | tee "$EVIDENCE/devices.txt"
          "$ADB" logcat -c || true

      # The production APK's home tab is a server screen: it must draw native content from the
      # local production server, over HTTPS with the run's CA.
      - name: Open the production APK against the local server
        working-directory: examples/${{ matrix.example }}
        env:
          APP_ID: ${{ matrix.app-id }}
          SERVER_ROUTES: ${{ matrix.server-routes }}
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          mkdir -p "$EVIDENCE/production"
          cp .farm/output/mobile/farm-routes.json "$EVIDENCE/production/farm-routes.json"
          "$ADB" install -r ".farm/output/mobile/dist/$APP_ID-debug.apk"
          "$ADB" logcat -c || true
          "$ADB" shell am start -W -n "$APP_ID/dev.farmjs.mobile.shell.MainActivity"
          # The shell logs "open->content=<ms>ms" once the home tab drew, or names a fallback.
          for _ in $(seq 1 45); do
            "$ADB" logcat -d -s FarmShell:V AndroidRuntime:E > "$EVIDENCE/production/app-log.txt"
            grep -qE "open->content=|showing the web screen|FATAL EXCEPTION" "$EVIDENCE/production/app-log.txt" && break
            sleep 2
          done
          "$ADB" exec-out screencap -p > "$EVIDENCE/production-home.png"
          tail -30 "$EVIDENCE/production/app-log.txt"
          # farm dev installs its own debug app under the same id later, and its checks read only
          # its own log.
          "$ADB" uninstall "$APP_ID" || true
          "$ADB" logcat -c || true
          # Split the routes into arguments without globbing: /trails/[id] is a route, not a pattern.
          set -f
          node "$GITHUB_WORKSPACE/examples/mobile/scripts/check-android-native.mjs" "$EVIDENCE/production" $SERVER_ROUTES

      # examples/mobile's React Native screen /map in the APK farm build made. Its trail blaze is
      # an image bundled with the screen (blaze.png): under farm dev Metro serves it, in a build
      # React Native reads it from the app's resources, so only the built APK checks the packaging.
      - name: Open the React Native screen /map in the built APK
        if: matrix.example == 'mobile'
        working-directory: examples/mobile
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          ID=dev.farmjs.examples.fieldnotes
          "$ADB" install -r ".farm/output/mobile/dist/$ID-debug.apk"
          "$ADB" logcat -c || true
          "$ADB" shell am start -W -n "$ID/dev.farmjs.mobile.shell.MainActivity" --es farmOpen /map
          # The shell logs "native app/map open->content=<ms>ms" once the screen drew.
          for _ in $(seq 1 45); do
            "$ADB" logcat -d -s FarmShell:V > "$EVIDENCE/map-log.txt"
            grep -q "native app/map open->content" "$EVIDENCE/map-log.txt" && break
            sleep 2
          done
          # The image decodes after the first frame: poll the screenshot for it.
          for _ in $(seq 1 10); do
            "$ADB" exec-out screencap -p > "$EVIDENCE/map.png"
            node scripts/check-bundled-image.mjs "$EVIDENCE/map.png" > /dev/null 2>&1 && break
            sleep 1
          done
          "$ADB" logcat -d -s FarmShell:V ReactNativeJS:V ReactNative:W AndroidRuntime:E > "$EVIDENCE/map-log.txt"
          tail -40 "$EVIDENCE/map-log.txt"
          grep -q "launch open /map" "$EVIDENCE/map-log.txt"
          grep -q "native app/map open->content" "$EVIDENCE/map-log.txt"
          node scripts/check-bundled-image.mjs "$EVIDENCE/map.png"
          # farm dev installs its own debug app under the same id next, and its checks read only
          # its own log: this app's home tab falls back while CI's production server has no
          # deployment.
          "$ADB" uninstall "$ID" || true
          "$ADB" logcat -c || true

      - name: Run the shell with farm dev --mobile
        working-directory: examples/${{ matrix.example }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          pnpm exec farm dev --mobile --port 3001 > "$EVIDENCE/farm-dev-android.txt" 2>&1 &
          echo "FARM_DEV_PID=$!" >> "$GITHUB_ENV"
          # The CLI builds, installs and launches the app, then prints "Opened <name> on <serial>."
          for _ in $(seq 1 180); do
            grep -q "Opened .* on " "$EVIDENCE/farm-dev-android.txt" && break
            if grep -qE "gradlew .* exited|Error:" "$EVIDENCE/farm-dev-android.txt"; then break; fi
            sleep 5
          done
          cat "$EVIDENCE/farm-dev-android.txt"
          grep -q "Opened .* on " "$EVIDENCE/farm-dev-android.txt"

      - name: Capture the running app
        env:
          APP_ID: ${{ matrix.app-id }}
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          # The first document loads from farm dev on the host; screenshot right away and as the
          # page settles, so a slow first load still shows.
          for t in 0 10 30; do
            sleep "$t"
            "$ADB" exec-out screencap -p > "$EVIDENCE/home-${t}s.png"
          done
          "$ADB" shell dumpsys activity activities | grep -iF "$APP_ID" | head -5 \
            | tee "$EVIDENCE/activity.txt" || true
          "$ADB" logcat -d > "$EVIDENCE/logcat-full.txt"
          "$ADB" logcat -d -s FarmShell:V AndroidRuntime:E > "$EVIDENCE/app-log.txt"
          grep -iE "FATAL|crash" "$EVIDENCE/app-log.txt" | head -20 || true

      - name: Check the home route drew native content
        working-directory: examples/${{ matrix.example }}
        env:
          SERVER_ROUTES: ${{ matrix.server-routes }}
        run: |
          cp .farm/output/mobile/farm-routes.json "$EVIDENCE/farm-routes.json"
          # Split the routes into arguments without globbing: /trails/[id] is a route, not a pattern.
          set -f
          node "$GITHUB_WORKSPACE/examples/mobile/scripts/check-android-native.mjs" "$EVIDENCE" $SERVER_ROUTES

      - name: Submit a native form from the app
        if: matrix.example == 'mobile-minimal'
        working-directory: examples/${{ matrix.example }}
        env:
          APP_ID: ${{ matrix.app-id }}
        run: node scripts/check-android-form.mjs "$EVIDENCE" "$APP_ID"

      - name: Stop the dev server and the production server
        if: always()
        run: |
          for pid in "${FARM_DEV_PID:-}" "${PRODUCTION_SERVER_PID:-}" "${HTTPS_PROXY_PID:-}"; do
            if [ -n "$pid" ]; then kill "$pid" 2>/dev/null || true; fi
          done

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mobile-android-${{ matrix.example }}-${{ github.sha }}
          path: ${{ runner.temp }}/android-evidence
          if-no-files-found: warn
