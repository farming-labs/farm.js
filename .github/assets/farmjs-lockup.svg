        fill: #f5f5f4;
      }

      .farm-primary-stroke {
        fill: #f5f5f4;
        stroke: #f5f5f4;
      }

      .farm-secondary {
        fill: #a3a3a3;
      }

      .farm-tertiary {
        fill: #595959;
      }
    }
  </style>

