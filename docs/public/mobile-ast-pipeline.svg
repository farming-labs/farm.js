<svg width="100%" viewBox="0 0 680 694" role="img" xmlns="http://www.w3.org/2000/svg">
<title>How Farm's mobile analyzer decides native or web</title>
<desc>A build-time pipeline: a page is parsed with Oxc into an AST, every node is classified as a port (can render native) or a block (must stay web), the portable nodes become a neutral UI tree, and a conservative rule decides whether the screen renders native or stays a web screen. Any doubt resolves to web.</desc>
<style>
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  .t{font-size:14px;font-weight:600;fill:#1f2430}
  .s{font-size:12px;fill:#1f2430;opacity:.7}
  .ar{stroke:#1f2430;opacity:.5;fill:none}
  .nb{fill:none;stroke:#d4d4d8}
  @media (prefers-color-scheme:dark){
    .t{fill:#e8e8ea}.s{fill:#e8e8ea;opacity:.74}.ar{stroke:#cfcfd4}.nb{stroke:#3f3f46}
  }
</style>
<defs><marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="ar" stroke-width="1">
<line x1="340" y1="94" x2="340" y2="122" marker-end="url(#af)"/>
<line x1="340" y1="174" x2="340" y2="202" marker-end="url(#af)"/>
<line x1="270" y1="262" x2="244" y2="294" marker-end="url(#af)"/>
<line x1="430" y1="262" x2="512" y2="294" marker-end="url(#af)"/>
<line x1="240" y1="396" x2="240" y2="430" marker-end="url(#af)"/>
<line x1="248" y1="484" x2="318" y2="514" marker-end="url(#af)"/>
<line x1="512" y1="396" x2="406" y2="514" marker-end="url(#af)"/>
<line x1="322" y1="580" x2="232" y2="614" marker-end="url(#af)"/>
<line x1="398" y1="580" x2="498" y2="614" marker-end="url(#af)"/>
</g>
<rect class="nb" x="250" y="44" width="180" height="50" rx="8"/>
<text class="t" x="340" y="70" text-anchor="middle">page.tsx</text>
<text class="s" x="340" y="87" text-anchor="middle">+ app modules, layouts</text>
<rect x="250" y="124" width="180" height="50" rx="8" fill="rgba(56,132,255,.13)" stroke="rgba(56,132,255,.5)"/>
<text class="t" x="340" y="150" text-anchor="middle">Parse with Oxc</text>
<text class="s" x="340" y="167" text-anchor="middle">parseSync → AST</text>
<rect x="120" y="204" width="440" height="58" rx="8" fill="rgba(160,90,240,.12)" stroke="rgba(160,90,240,.5)"/>
<text class="t" x="340" y="230" text-anchor="middle">Walk the AST, classify every node</text>
<text class="s" x="340" y="248" text-anchor="middle">JSX · class names · styles · imports · globals</text>
<rect x="96" y="296" width="288" height="100" rx="8" fill="rgba(34,180,90,.14)" stroke="rgba(34,180,90,.55)"/>
<text class="t" x="240" y="320" text-anchor="middle">Ports → can go native</text>
<text class="s" x="240" y="342" text-anchor="middle">div → View · span → Text · img → Image</text>
<text class="s" x="240" y="360" text-anchor="middle">button/a → Pressable · input → TextInput</text>
<text class="s" x="240" y="378" text-anchor="middle">ul/ol → List · @farm.js/ui · Tailwind</text>
<rect x="400" y="296" width="232" height="100" rx="8" fill="rgba(230,70,70,.12)" stroke="rgba(230,70,70,.5)"/>
<text class="t" x="516" y="319" text-anchor="middle">Blocks → must stay web</text>
<text class="s" x="516" y="339" text-anchor="middle">canvas · iframe · svg · table</text>
<text class="s" x="516" y="356" text-anchor="middle">form · dangerouslySetInnerHTML</text>
<text class="s" x="516" y="373" text-anchor="middle">window · document · refs</text>
<text class="s" x="516" y="390" text-anchor="middle">arbitrary CSS · RSC · markdown</text>
<rect x="96" y="430" width="288" height="52" rx="8" fill="rgba(20,170,160,.14)" stroke="rgba(20,170,160,.55)"/>
<text class="t" x="240" y="456" text-anchor="middle">Portable UI tree (IR)</text>
<text class="s" x="240" y="473" text-anchor="middle">FarmUiNode: View / Text / Image / List</text>
<rect x="220" y="516" width="280" height="64" rx="8" fill="rgba(230,150,20,.15)" stroke="rgba(230,150,20,.55)"/>
<text class="t" x="360" y="540" text-anchor="middle">Decide, per screen</text>
<text class="s" x="360" y="558" text-anchor="middle">native if 0 blockers + a win</text>
<text class="s" x="360" y="574" text-anchor="middle">any doubt → web</text>
<rect x="96" y="616" width="250" height="58" rx="8" fill="rgba(34,180,90,.14)" stroke="rgba(34,180,90,.55)"/>
<text class="t" x="221" y="642" text-anchor="middle">Native screen</text>
<text class="s" x="221" y="660" text-anchor="middle">renders as native views</text>
<rect x="382" y="616" width="250" height="58" rx="8" fill="rgba(140,150,165,.12)" stroke="rgba(140,150,165,.5)"/>
<text class="t" x="507" y="642" text-anchor="middle">Web screen</text>
<text class="s" x="507" y="660" text-anchor="middle">the Farm page in a WebView</text>
</svg>
