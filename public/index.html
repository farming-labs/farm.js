<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Farm.js</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: Canvas;
        color: CanvasText;
      }

      main {
        width: min(36rem, calc(100vw - 3rem));
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        line-height: 1;
      }

      p {
        margin: 0;
        color: color-mix(in srgb, CanvasText 70%, transparent);
        font-size: 1.125rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Farm.js</h1>
      <p>The package build completed successfully.</p>
    </main>
  </body>
</html>
